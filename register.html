<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro – Os Contos de Ynana</title>
  <style>
    /* RESET */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: url('https://www.transparenttextures.com/patterns/paper-fibers.png'), #f4e2c8;
      background-blend-mode: multiply;
      background-size: cover;
      font-family: 'Spectral SC', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem 1rem;
    }

    /* botão Voltar */
    .btn-back {
      align-self: flex-start;
      margin-bottom: 1rem;
      background: transparent;
      border: 2px solid #4a2e14;
      color: #4a2e14;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .btn-back:hover {
      background: #4a2e14;
      color: #fff;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      color: #4a2e14;
      margin-bottom: 1.5rem;
    }

    form {
      background: rgba(255, 255, 255, 0.8);
      padding: 2rem;
      border-radius: 8px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    label {
      display: block;
      font-size: 1rem;
      color: #4a2e14;
      margin-bottom: 0.5rem;
      text-align: left;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    select {
      width: 100%;
      padding: 0.6rem 0.8rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 1.2rem;
      font-family: inherit;
    }
    input:focus,
    select:focus {
      outline: none;
      border-color: #d4af37;
      box-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
    }

    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      font-size: 1.1rem;
      font-family: inherit;
      background: #d4af37;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .btn-submit:hover {
      background: #b58e2e;
    }
    .btn-submit:active {
      transform: scale(0.97);
    }

    /* responsivo */
    @media (max-width: 480px) {
      form {
        padding: 1.5rem;
      }
      h1 {
        font-size: 2rem;
      }
    }

    /* rodapé */
    footer {
      width: 100%;
      padding: 1rem 0;
      background: rgba(0, 0, 0, 0.05);
      text-align: center;
      font-size: 0.9rem;
      color: #4a2e14;
      opacity: 0.7;
      margin-top: auto;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Spectral+SC&display=swap" rel="stylesheet">
<script type="module" src="register.js"></script>

</head>

<body>


  <h1>Registro de Aventureiro</h1>

  <form method="POST">
    <!-- Email -->
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required placeholder="seu@email.com">

    <!-- Usuário -->
    <label for="username">Nome de Usuário</label>
    <input type="text" id="username" name="username" required placeholder="Digite seu usuário">

    <!-- Personagem Favorito -->
    <label for="favorite">Personagem Favorito</label>
    <select id="favorite" name="favorite" required>
      <option value="" disabled selected>Escolha um personagem</option>
      <option value="Ynana">Ynana</option>
      <option value="Rufus">Rufus</option>
      <option value="Hela">Hela</option>
      <option value="Nenhum">Nenhum</option>
      <option value="Outro">Outro</option>
    </select>

    <!-- Senha -->
    <label for="password">Senha</label>
    <input type="password" id="password" name="password" required placeholder="Mínimo 6 caracteres">

    <!-- Confirmação de Senha -->
    <label for="confirm_password">Confirme a Senha</label>
    <input type="password" id="confirm_password" name="confirm_password" required placeholder="Repita sua senha">
    <!-- Mensagem de erro -->
<div id="error-message" style="color: darkred; font-size: 0.95rem; margin-bottom: 1rem;"></div>

  <!-- BOTÃO VOLTAR -->
  <button class="btn-back" onclick="location.href='index.html'">
    ← Voltar
  </button>
    <button type="submit" class="btn-submit">Registrar</button>
  </form>

  <footer>
    © 2025 Os Contos de Ynana. Todos os direitos reservados.
  </footer>
  <script>
    // Validação em tempo real das senhas
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm_password');
  
    function checkPasswordsMatch() {
      if (confirmInput.value !== passwordInput.value) {
        confirmInput.setCustomValidity('Senhas divergentes');
      } else {
        confirmInput.setCustomValidity('');
      }
    }
  
    passwordInput.addEventListener('input', checkPasswordsMatch);
    confirmInput.addEventListener('input', checkPasswordsMatch);
  </script>
  
</body>
</html>
